name: Portable skill

on:
  push:
    branches: [main]
    tags: ['skill-v*']
    paths:
      - 'SKILL.md'
      - 'install_skill.py'
      - 'emoji_catalog.py'
      - 'emoji_selection.py'
      - 'scripts/**'
      - 'tools/select_emoji.py'
      - 'tools/skill_package.py'
      - 'agents/**'
      - 'references/**'
      - 'data/emoji-packs.json'
      - 'data/emoji-compositions.json'
      - 'data/selection-policy.json'
      - 'tests/test_selection*.py'
      - 'tests/test_skill*.py'
      - 'tests/selection_cases.json'
      - '.github/workflows/skill-package.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify selection and saved profiles
        run: python -m unittest discover -s tests -p 'test_selection*.py' -v
      - name: Verify isolated installation and package
        run: python -m unittest discover -s tests -p 'test_skill*.py' -v
      - name: Verify shared catalog and compositions
        run: |
          python -m unittest discover -s tests -p 'test_site.py' -v
          python -m unittest discover -s tests -p 'test_compositions.py' -v

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build standalone archives
        run: python tools/skill_package.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-premium-emoji
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/skill-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: telegram-premium-emoji
          path: dist
      - name: Publish downloadable skill
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" dist/telegram-premium-emoji.zip dist/telegram-premium-emoji.skill dist/SHA256SUMS --title "Telegram Premium Emoji $RELEASE_TAG" --generate-notes
