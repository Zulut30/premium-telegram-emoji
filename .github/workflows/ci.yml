name: Project CI

on:
  push:
    branches: [main]
    tags: ['skill-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate data, core, bot, packages and web parity
        run: python scripts/project.py check --web

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build standalone archives
        run: python tools/skill_package.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-premium-emoji
          path: dist/*
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache emoji thumbnails
        uses: actions/cache@v4
        with:
          path: site/images
          key: emoji-images-${{ hashFiles('references/emoji-catalog.md') }}
          restore-keys: emoji-images-
      - name: Generate site
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python generate_site.py
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/skill-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: telegram-premium-emoji
          path: dist
      - name: Publish downloadable skill
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" dist/telegram-premium-emoji.zip dist/telegram-premium-emoji.skill dist/SHA256SUMS --title "Telegram Premium Emoji $RELEASE_TAG" --generate-notes
